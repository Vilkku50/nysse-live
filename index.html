<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nysse — bussit kartalla</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg: #0b0f14;
    --panel: #121820;
    --panel-2: #182130;
    --line: #23303f;
    --text: #dfe8f0;
    --dim: #7d93a8;
    --accent: #ffb400;
    --accent-2: #35c2c1;
    --danger: #ff5d5d;
    --user-blue: #3b82f6;
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
    overscroll-behavior: none; overflow: hidden;
  }
  /* Matches CARTO Voyager's own background color (its landmass_fill), so a
     tile that hasn't loaded yet — e.g. right after zooming out to an area
     never fetched before — blends in instead of flashing as a black square. */
  #map { position: absolute; inset: 0; background: #fbf8f3; }

  #hud {
    position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px;
    z-index: 1000; display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  #hud-top { display: flex; gap: 8px; align-items: flex-start; }
  #alerts-banner {
    display: none; pointer-events: auto; text-align: left; cursor: pointer;
    padding: 9px 12px; font-family: var(--mono); font-size: 12px; font-weight: 700;
    color: #3a2c00; background: var(--accent); border: none; border-radius: 10px;
  }
  #alerts-banner:active { filter: brightness(0.95); }
  .panel {
    pointer-events: auto;
    /* Solid background, no backdrop-filter: blurring the map live underneath
       these panels forces a full-screen re-blur on every pan/zoom frame,
       which is a major jank source on Android Chrome. */
    background: rgba(15,20,27,0.97);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  #title-card { padding: 10px 14px; flex: 0 0 auto; user-select: none; }
  #title-card h1 { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin: 0; color: var(--text); }
  #title-card .sub { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-top: 3px; display:flex; gap:8px; align-items:center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-2); display:inline-block; transition: background-color 0.3s ease; }
  .dot.stale { background: var(--danger); }
  .dot.pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }

  #filter-card { padding: 8px 10px; flex: 1 1 auto; max-width: 420px; display:flex; flex-direction:column; gap:6px; }
  #filter-row { position: relative; display: flex; }
  #filter-input {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    font-family: var(--mono); font-size: 13px; padding: 9px 32px 9px 10px; border-radius: 7px; outline: none; width: 100%;
    transition: border-color 0.15s ease;
  }
  #filter-input::placeholder { color: var(--dim); }
  #filter-input:focus { border-color: var(--accent-2); }
  #filter-clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 50%; border: none; background: transparent;
    color: var(--dim); font-size: 16px; line-height: 1; cursor: pointer; display: none;
    align-items: center; justify-content: center;
  }
  #filter-clear:active { background: var(--panel-2); color: var(--text); }
  #route-chips { display:flex; flex-wrap:wrap; gap:6px; max-height: 88px; overflow-y:auto; }
  .chip {
    font-family: var(--mono); font-size: 12px; padding: 6px 10px; border-radius: 6px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--dim); cursor: pointer; user-select:none;
    white-space: nowrap; transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .chip:active { transform: scale(0.93); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #1a1300; font-weight: 700; }

  #map-controls {
    position: absolute; right: 12px; bottom: max(46px, calc(env(safe-area-inset-bottom) + 46px));
    z-index: 1000; display: flex; flex-direction: column; gap: 8px;
  }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(15,20,27,0.97); color: var(--text); font-size: 18px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform 0.1s ease, background-color 0.15s ease;
  }
  .icon-btn:active { transform: scale(0.92); background: var(--panel-2); }
  .icon-btn.active { color: var(--user-blue); border-color: var(--user-blue); }

  #stats {
    position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); left: 12px; z-index: 1000;
    padding: 8px 12px; font-family: var(--mono); font-size: 11px; color: var(--dim);
    display:flex; gap: 14px; user-select: none;
  }
  #stats b { color: var(--text); }

  #err {
    position:absolute; bottom: max(12px, env(safe-area-inset-bottom)); right: 12px; z-index: 1000;
    padding: 8px 12px; font-family: var(--mono); font-size: 11px; color: var(--danger);
    display:none; max-width: 320px;
  }

  /* Position and rotation are animated by a JS rAF loop (see tickMarkerAnimations),
     not CSS transitions: Leaflet's marker transform is zoom-dependent pixel math,
     so a CSS transition frozen mid-flight by a zoom change interpolates stale,
     wrong-zoom pixels and visibly "floats". Driving real lat/lon + rotation values
     every frame lets Leaflet re-project correctly regardless of what the map does. */
  .leaflet-marker-icon { transition: opacity 0.35s ease; will-change: transform; }

  .bus-icon {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent-2); border: 2px solid #06282b;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--mono); font-weight:800; font-size: 9px; color: #06282b;
    box-shadow: 0 0 0 2px rgba(53,194,193,0.25);
    transform-origin: center center;
    transition: background-color 0.2s ease, box-shadow 0.2s ease;
    /* Rotated every animation frame from JS (tickMarkerAnimations) — hint the
       compositor to keep this on its own GPU layer so rotation stays smooth
       up to whatever refresh rate the display actually runs at (60/90/120Hz
       etc.); requestAnimationFrame already paces to the real refresh rate on
       its own, this just avoids main-thread repaint work becoming the cap. */
    will-change: transform;
  }
  .bus-icon.picked { background: var(--accent); box-shadow: 0 0 0 3px rgba(255,180,0,0.35); }
  .bus-icon .arrow {
    position:absolute; width: 0; height: 0;
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-bottom: 7px solid var(--accent-2);
    top: -8px; transition: border-bottom-color 0.2s ease;
  }
  .bus-icon.picked .arrow { border-bottom-color: var(--accent); }
  .bus-icon .label { display: inline-block; will-change: transform; }

  .user-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--user-blue); border: 2px solid #fff; box-shadow: 0 0 0 2px rgba(59,130,246,0.35); }

  .leaflet-popup-content-wrapper { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; }
  .leaflet-popup-tip { background: var(--panel); }
  .popup-line1 { font-weight: 800; font-size: 15px; margin-bottom: 2px; }
  .popup-line2 { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-bottom: 6px; }

  .stop-arrivals { display: flex; flex-direction: column; gap: 4px; min-width: 140px; max-height: 220px; overflow-y: auto; padding-right: 2px; }
  .stop-arrival { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 12px; }
  .stop-arrival-route { font-weight: 800; color: var(--text); background: var(--panel-2); border-radius: 4px; padding: 1px 6px; }
  .stop-arrival-time { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3; }
  .stop-arrival-empty { font-family: var(--mono); font-size: 11px; color: var(--dim); }

  .popup-btn {
    margin-top: 8px; width: 100%; padding: 7px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    font-family: var(--mono); font-size: 11px; cursor: pointer; text-align: center;
  }
  .popup-btn:active { background: var(--line); }
  .popup-btn.fav-on { border-color: var(--accent); color: var(--accent); }

  /* Shared bottom-sheet chrome for both the bus route panel and the alerts panel. */
  .sheet-panel {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1200;
    max-height: 55vh; display: none; flex-direction: column;
    border-radius: 14px 14px 0 0; border-bottom: none;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .sheet-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px 10px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  .sheet-title { font-weight: 800; font-size: 14px; }
  .sheet-close {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font-size: 18px; line-height: 1;
    cursor: pointer; flex: 0 0 auto;
  }
  .sheet-close:active { background: var(--line); }
  .sheet-list { overflow-y: auto; padding: 8px 14px 14px; display: flex; flex-direction: column; gap: 2px; }

  .route-stop-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-family: var(--mono); font-size: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line);
  }
  .route-stop-row:last-child { border-bottom: none; }
  .route-stop-name { color: var(--text); }
  .route-stop-eta { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3; white-space: nowrap; }
  .eta-mins { color: var(--accent-2); font-weight: 700; }
  .eta-clock { color: var(--dim); font-weight: 500; font-size: 0.85em; }

  .alert-row { padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .alert-row:last-child { border-bottom: none; }
  .alert-title { font-family: var(--mono); font-weight: 800; font-size: 12px; color: var(--text); margin-bottom: 2px; }
  .alert-desc { font-family: var(--mono); font-size: 11px; color: var(--dim); line-height: 1.4; }

  #planner-form { padding: 10px 14px 4px; display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; }
  .planner-field { position: relative; }
  #planner-origin, #planner-dest, #planner-time {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    font-family: var(--mono); font-size: 13px; padding: 9px 10px; border-radius: 7px; outline: none;
  }
  #planner-origin::placeholder, #planner-dest::placeholder { color: var(--dim); }
  #planner-origin:focus, #planner-dest:focus, #planner-time:focus { border-color: var(--accent-2); }
  .planner-suggestions {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 10;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    max-height: 180px; overflow-y: auto;
  }
  .planner-suggestion {
    padding: 9px 10px; font-family: var(--mono); font-size: 12px; color: var(--text); cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .planner-suggestion:last-child { border-bottom: none; }
  .planner-suggestion:active { background: var(--panel-2); }

  .planner-option { padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .planner-option:last-child { border-bottom: none; }
  .planner-option-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 12px; margin-bottom: 2px; }
  .planner-option-times { color: var(--accent-2); font-weight: 700; }
  .planner-option-sub { font-family: var(--mono); font-size: 10px; color: var(--dim); }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
</style>
</head>
<body>

<div id="map"></div>

<div id="hud">
  <div id="hud-top">
    <div id="title-card" class="panel">
      <h1>Nysse · Live</h1>
      <div class="sub"><span id="status-dot" class="dot pulse"></span><span id="status-text">yhdistetään…</span></div>
    </div>
    <div id="filter-card" class="panel">
      <div id="filter-row">
        <input id="filter-input" type="text" inputmode="search" placeholder="Suodata linja (esim. 3, 8B, 21) — tyhjä = kaikki" />
        <button id="filter-clear" aria-label="Tyhjennä suodatin">×</button>
      </div>
      <div id="route-chips"></div>
    </div>
  </div>
  <button id="alerts-banner" type="button"></button>
</div>

<div id="map-controls">
  <button id="btn-planner" class="icon-btn" title="Reittihaku" aria-label="Reittihaku">🧭</button>
  <button id="btn-locate" class="icon-btn" title="Oma sijainti" aria-label="Oma sijainti">◎</button>
  <button id="btn-fit" class="icon-btn" title="Näytä kaikki bussit" aria-label="Näytä kaikki bussit">⛶</button>
</div>

<div id="stats">
  <span>Ajoneuvoja: <b id="stat-count">0</b></span>
  <span>Linjoja: <b id="stat-routes">0</b></span>
  <span>Päivitetty: <b id="stat-time">–</b></span>
</div>

<div id="err"></div>

<div id="route-panel" class="panel sheet-panel">
  <div class="sheet-header">
    <div id="route-panel-title" class="sheet-title"></div>
    <button id="route-panel-close" class="sheet-close" aria-label="Sulje">×</button>
  </div>
  <div id="route-panel-list" class="sheet-list"></div>
</div>

<div id="alerts-panel" class="panel sheet-panel">
  <div class="sheet-header">
    <div class="sheet-title">Häiriötiedotteet</div>
    <button id="alerts-panel-close" class="sheet-close" aria-label="Sulje">×</button>
  </div>
  <div id="alerts-panel-list" class="sheet-list"></div>
</div>

<div id="planner-panel" class="panel sheet-panel">
  <div class="sheet-header">
    <div class="sheet-title">Reittihaku</div>
    <button id="planner-close" class="sheet-close" aria-label="Sulje">×</button>
  </div>
  <div id="planner-form">
    <div class="planner-field">
      <input id="planner-origin" type="text" inputmode="search" placeholder="Lähtöpysäkki" autocomplete="off" />
      <div id="planner-origin-suggestions" class="planner-suggestions"></div>
    </div>
    <div class="planner-field">
      <input id="planner-dest" type="text" inputmode="search" placeholder="Määränpää" autocomplete="off" />
      <div id="planner-dest-suggestions" class="planner-suggestions"></div>
    </div>
    <div class="planner-field">
      <input id="planner-time" type="datetime-local" />
    </div>
    <button id="planner-search" class="popup-btn" type="button">Hae yhteyksiä</button>
  </div>
  <div id="planner-results" class="sheet-list"></div>
</div>

<script>
const FEED_URL = "https://data.itsfactory.fi/journeys/api/1/gtfs-rt/vehicle-positions/json";
const STOPS_URL = "https://data.itsfactory.fi/journeys/api/1/stop-points";
const VEHICLE_ACTIVITY_URL = "https://data.itsfactory.fi/journeys/api/1/vehicle-activity";
const SERVICE_ALERTS_URL = "https://data.itsfactory.fi/journeys/api/1/gtfs-rt/service-alerts/json";
const POLL_MS = 5000;
const ARRIVALS_POLL_MS = 15000;
const ALERTS_POLL_MS = 60000;
const STOP_MIN_ZOOM = 15;
const TAMPERE_CENTER = [61.4978, 23.7610];
// SW/NE corners padded a bit around Finland's mainland — Nysse only runs in
// Tampere, but this keeps panning/zooming from wandering off into fetching
// tiles for the rest of the planet.
const FINLAND_BOUNDS = [[59.0, 18.5], [70.5, 32.0]];

const map = L.map('map', {
  zoomControl: true, attributionControl: true, fadeAnimation: true, preferCanvas: true,
  minZoom: 6, maxBounds: FINLAND_BOUNDS, maxBoundsViscosity: 1.0
}).setView(TAMPERE_CENTER, 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO · Bussidata: Tampereen joukkoliikenne / ITS Factory',
  maxZoom: 19,
  minZoom: 6,
  keepBuffer: 4,
  // Redraw tiles only once a zoom gesture settles instead of on every
  // intermediate frame — this is what caused the map to look like it kept
  // reloading while pinch-zooming or double-tapping.
  updateWhenZooming: false
}).addTo(map);

const markers = new Map(); // vehicle id -> {marker, routeId, lastSeen, iconEl, labelEl, rotation, trip, animating, anim*}
const SELECTED_ROUTES_KEY = 'nysse-live:selected-routes';
function loadSelectedRoutes() {
  try {
    const raw = localStorage.getItem(SELECTED_ROUTES_KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch (e) { return new Set(); }
}
function saveSelectedRoutes() {
  try { localStorage.setItem(SELECTED_ROUTES_KEY, JSON.stringify(Array.from(selectedRoutes))); } catch (e) {}
}

let selectedRoutes = loadSelectedRoutes();
let filterText = "";
let lastFetchOk = null;
let lastAllRoutes = new Set();
let lastRouteSignature = "";

function shortestRotation(fromDeg, toDeg) {
  const delta = ((toDeg - fromDeg + 540) % 360) - 180;
  return fromDeg + delta;
}

// Route/stop codes come from a small, structured vocabulary and are safe as
// used elsewhere, but alert text and resolved stop names are free-form
// content from an external feed, so they get escaped before going into
// innerHTML.
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function buildIconHtml(routeId, picked) {
  return `<div class="bus-icon ${picked ? 'picked' : ''}">
      <div class="arrow"></div>
      <span class="label">${routeId}</span>
    </div>`;
}

const OCCUPANCY_LABELS = {
  EMPTY: 'Tyhjä',
  MANY_SEATS_AVAILABLE: 'Tilaa hyvin',
  FEW_SEATS_AVAILABLE: 'Muutama paikka vapaana',
  STANDING_ROOM_ONLY: 'Vain seisomapaikkoja',
  CRUSHED_STANDING_ROOM_ONLY: 'Täynnä, hyvin ahdasta',
  FULL: 'Täynnä',
  NOT_ACCEPTING_PASSENGERS: 'Ei ota matkustajia',
};

// SIRI's delay is normally an ISO-8601 duration (e.g. "-PT1M30S" for running
// early), but some feeds send it as a plain number of seconds — handle both
// rather than assuming one and silently showing nothing (or garbage) for
// the other.
function parseIsoDurationSeconds(iso) {
  if (typeof iso !== 'string') return null;
  const m = iso.match(/^(-)?P(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?)?$/);
  if (!m || (!m[2] && !m[3] && !m[4])) return null;
  const sign = m[1] ? -1 : 1;
  return sign * (Number(m[2] || 0) * 3600 + Number(m[3] || 0) * 60 + Number(m[4] || 0));
}
function parseDelaySeconds(raw) {
  if (raw == null) return null;
  if (typeof raw === 'number' && Number.isFinite(raw)) return raw;
  if (typeof raw === 'string') {
    const iso = parseIsoDurationSeconds(raw);
    if (iso != null) return iso;
    const num = Number(raw);
    if (Number.isFinite(num)) return num;
  }
  return null;
}
function formatDelay(delaySec) {
  if (delaySec == null) return null;
  const mins = Math.round(Math.abs(delaySec) / 60);
  if (mins === 0) return 'Ajallaan';
  return mins + ' min ' + (delaySec > 0 ? 'myöhässä' : 'etuajassa');
}

function popupHtml(entry, vehicleId) {
  const start = entry.trip ? (entry.trip.start_time || '') : '';
  const info = vehicleInfoByVehicle.get(vehicleId);
  const destLine = info && info.destinationName
    ? `<div class="popup-line2">→ ${escapeHtml(info.destinationName)}</div>` : '';
  const delayText = info ? formatDelay(info.delaySec) : null;
  const delayLine = delayText ? `<div class="popup-line2">${delayText}</div>` : '';
  const occupancyLabel = OCCUPANCY_LABELS[entry.occupancy];
  const occupancyLine = occupancyLabel ? `<div class="popup-line2">${occupancyLabel}</div>` : '';
  return `<div class="popup-line1">Linja ${entry.routeId}</div>
          <div class="popup-line2">Ajoneuvo ${vehicleId}${start ? ' · lähtö ' + start : ''}</div>
          ${destLine}${delayLine}${occupancyLine}
          <button class="popup-btn" onclick="showVehicleRoute('${vehicleId}', '${entry.routeId}')">Näytä tulevat pysäkit</button>`;
}

// --- Stops + per-stop arrival predictions -----------------------------
// Stop locations come from the static stop-points list (fetched once).
// Arrival predictions come from vehicle-activity's onwardCalls, which list
// every upcoming stop for every active vehicle with an expected time —
// polled separately (and less often) from the bus-position feed so a
// hiccup in one never affects the other. The same onwardCalls also get
// regrouped by vehicle instead of by stop, powering the "show this bus's
// upcoming stops" panel.
let allStops = [];
let stopsLoaded = false;
let arrivalsByStop = new Map(); // stopId -> [{routeId, time, vehicleId}], soonest first
let onwardCallsByVehicle = new Map(); // vehicleRef -> [{stopId, time}], soonest first
let vehicleInfoByVehicle = new Map(); // vehicleRef -> {delaySec, destinationName, originName}

// destinationShortName/originShortName in vehicle-activity are stop codes,
// not readable names (confirmed against other Nysse client source) — resolve
// them against the stop-points list we already load, no extra request needed.
function resolveStopName(shortCode) {
  if (!shortCode) return null;
  const stop = allStops.find(s => s.id === shortCode);
  return stop ? stop.name : shortCode;
}

const FAVORITE_STOPS_KEY = 'nysse-live:favorite-stops';
function loadFavoriteStops() {
  try {
    const raw = localStorage.getItem(FAVORITE_STOPS_KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch (e) { return new Set(); }
}
function saveFavoriteStops() {
  try { localStorage.setItem(FAVORITE_STOPS_KEY, JSON.stringify(Array.from(favoriteStops))); } catch (e) {}
}
let favoriteStops = loadFavoriteStops();

// Every stop marker is really a pair: a small visual dot (non-interactive,
// so it never steals the tap) plus a larger invisible circle underneath
// that owns the popup — a 5px dot is a hopeless target on a phone, but a
// visibly huge dot would clutter the map, so only the *hit area* is big.
const stopMarkers = new Map(); // stopId -> {dot, hit}
const stopLayer = L.layerGroup().addTo(map);
// Favorites render on their own always-on layer (not gated by zoom/viewport
// like regular stops), styled distinctly, so a rider's saved stops stay
// findable without having to zoom all the way into that exact spot.
const favoriteMarkers = new Map(); // stopId -> {dot, hit}
const favoriteLayer = L.layerGroup().addTo(map);

function createStopMarker(stop, layer, isFavorite) {
  const dot = L.circleMarker([stop.lat, stop.lon], isFavorite
    ? { radius: 7, weight: 3, color: '#3a2c00', fillColor: '#ffb400', fillOpacity: 1, interactive: false }
    : { radius: 5, weight: 2, color: '#0b0f14', fillColor: '#dfe8f0', fillOpacity: 1, interactive: false });
  const hit = L.circleMarker([stop.lat, stop.lon], { radius: 14, weight: 0, fillOpacity: 0, opacity: 0 });
  hit.bindPopup(() => stopPopupHtml(stop), { maxWidth: 260 });
  dot.addTo(layer);
  hit.addTo(layer);
  return { dot, hit };
}

function removeStopMarker(layer, entry) {
  layer.removeLayer(entry.dot);
  layer.removeLayer(entry.hit);
}

async function loadStops() {
  try {
    const res = await fetch(STOPS_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allStops = (data.body || []).map(s => {
      const [lat, lon] = (s.location || '').split(',').map(Number);
      return { id: s.shortName, name: s.name || s.shortName, lat, lon };
    }).filter(s => Number.isFinite(s.lat) && Number.isFinite(s.lon));
    stopsLoaded = true;
    renderFavoriteStops();
    renderVisibleStops();
  } catch (e) {
    console.error('Pysäkkien haku epäonnistui', e);
  }
}

function formatEta(time) {
  const mins = Math.round((time - Date.now()) / 60000);
  const rel = mins <= 0 ? 'nyt' : (mins === 1 ? '1 min' : mins + ' min');
  const clock = time.toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' });
  return `<span class="eta-mins">${rel}</span><span class="eta-clock">${clock}</span>`;
}

function stopPopupHtml(stop) {
  const isFav = favoriteStops.has(stop.id);
  const arrivals = (arrivalsByStop.get(stop.id) || []).slice(0, 20);
  const rows = arrivals.length
    ? arrivals.map(a => `<div class="stop-arrival"><span class="stop-arrival-route">${a.routeId}</span><span class="stop-arrival-time">${formatEta(a.time)}</span></div>`).join('')
    : '<div class="stop-arrival-empty">Ei tiedossa saapumisia</div>';
  return `<div class="popup-line1">${escapeHtml(stop.name)}</div>
          <div class="popup-line2">Pysäkki ${stop.id}</div>
          <div class="stop-arrivals">${rows}</div>
          <button class="popup-btn${isFav ? ' fav-on' : ''}" onclick="toggleFavoriteStop('${stop.id}')">${isFav ? '★ Poista suosikeista' : '☆ Lisää suosikiksi'}</button>`;
}

function renderFavoriteStops() {
  if (!stopsLoaded) return;
  favoriteMarkers.forEach((entry, id) => {
    if (!favoriteStops.has(id)) { removeStopMarker(favoriteLayer, entry); favoriteMarkers.delete(id); }
  });
  favoriteStops.forEach(id => {
    if (favoriteMarkers.has(id)) return;
    const stop = allStops.find(s => s.id === id);
    if (!stop) return; // stop-points not loaded yet; loadStops() re-renders once ready
    favoriteMarkers.set(id, createStopMarker(stop, favoriteLayer, true));
  });
}

function toggleFavoriteStop(stopId) {
  if (favoriteStops.has(stopId)) favoriteStops.delete(stopId);
  else favoriteStops.add(stopId);
  saveFavoriteStops();
  renderFavoriteStops();
  renderVisibleStops();
  const entry = favoriteMarkers.get(stopId) || stopMarkers.get(stopId);
  if (entry) entry.hit.openPopup();
}

function renderVisibleStops() {
  if (!stopsLoaded) return;
  if (map.getZoom() < STOP_MIN_ZOOM) {
    if (stopMarkers.size) { stopMarkers.forEach(entry => removeStopMarker(stopLayer, entry)); stopMarkers.clear(); }
    return;
  }
  const bounds = map.getBounds().pad(0.25);
  const visibleIds = new Set();
  allStops.forEach(s => {
    if (favoriteStops.has(s.id)) return; // favorites live on their own always-visible layer
    if (!bounds.contains([s.lat, s.lon])) return;
    visibleIds.add(s.id);
    if (!stopMarkers.has(s.id)) {
      stopMarkers.set(s.id, createStopMarker(s, stopLayer, false));
    }
  });
  // drop stop markers that scrolled out of view
  stopMarkers.forEach((entry, id) => {
    if (!visibleIds.has(id)) { removeStopMarker(stopLayer, entry); stopMarkers.delete(id); }
  });
}
map.on('moveend zoomend', renderVisibleStops);

function refreshOpenStopPopups() {
  [stopMarkers, favoriteMarkers].forEach(map => map.forEach((entry, id) => {
    if (!entry.hit.isPopupOpen()) return;
    const stop = allStops.find(s => s.id === id);
    if (stop) entry.hit.setPopupContent(stopPopupHtml(stop));
  }));
}

let openVehiclePanelId = null;
let vehicleRouteLine = null;

function vehiclePanelHtml(vehicleId) {
  const calls = onwardCallsByVehicle.get(vehicleId) || [];
  if (!calls.length) return '<div class="stop-arrival-empty">Ei tiedossa pysäkkiaikatauluja tälle ajoneuvolle.</div>';
  return calls.map(c => {
    const name = resolveStopName(c.stopId) || ('Pysäkki ' + c.stopId);
    return `<div class="route-stop-row"><span class="route-stop-name">${escapeHtml(name)}</span><span class="route-stop-eta">${formatEta(c.time)}</span></div>`;
  }).join('');
}

function drawVehicleRouteLine(vehicleId) {
  removeVehicleRouteLine();
  const calls = onwardCallsByVehicle.get(vehicleId) || [];
  const points = calls
    .map(c => allStops.find(s => s.id === c.stopId))
    .filter(Boolean)
    .map(s => [s.lat, s.lon]);
  if (points.length < 2) return;
  vehicleRouteLine = L.polyline(points, { color: '#ffb400', weight: 4, opacity: 0.8, dashArray: '1 9', lineCap: 'round' }).addTo(map);
}

function removeVehicleRouteLine() {
  if (vehicleRouteLine) { map.removeLayer(vehicleRouteLine); vehicleRouteLine = null; }
}

function showVehicleRoute(vehicleId, routeId) {
  closeAlertsPanel();
  closePlannerPanel();
  openVehiclePanelId = vehicleId;
  document.getElementById('route-panel-title').textContent = 'Linja ' + routeId + ' · tulevat pysäkit';
  document.getElementById('route-panel-list').innerHTML = vehiclePanelHtml(vehicleId);
  document.getElementById('route-panel').style.display = 'flex';
  drawVehicleRouteLine(vehicleId);
}

function closeVehicleRoute() {
  openVehiclePanelId = null;
  document.getElementById('route-panel').style.display = 'none';
  removeVehicleRouteLine();
}
document.getElementById('route-panel-close').addEventListener('click', closeVehicleRoute);

function refreshOpenVehiclePanel() {
  if (!openVehiclePanelId) return;
  document.getElementById('route-panel-list').innerHTML = vehiclePanelHtml(openVehiclePanelId);
  drawVehicleRouteLine(openVehiclePanelId);
}

// --- Service alerts -----------------------------------------------------
function alertActivePeriodCovers(periods, nowSec) {
  if (!periods || !periods.length) return true; // GTFS-RT: no active_period means always active
  return periods.some(p => {
    const start = p.start != null ? Number(p.start) : -Infinity;
    const end = p.end != null ? Number(p.end) : Infinity;
    return nowSec >= start && nowSec <= end;
  });
}
function pickTranslation(field) {
  if (!field || !Array.isArray(field.translation)) return '';
  const fi = field.translation.find(t => t.language === 'fi');
  return (fi || field.translation[0] || {}).text || '';
}

let activeAlerts = [];

async function pollServiceAlerts() {
  try {
    const res = await fetch(SERVICE_ALERTS_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const nowSec = Date.now() / 1000;
    activeAlerts = (data.entity || [])
      .map(ent => ent.alert)
      .filter(Boolean)
      .filter(alert => alertActivePeriodCovers(alert.active_period, nowSec))
      .map(alert => ({ title: pickTranslation(alert.header_text), description: pickTranslation(alert.description_text) }))
      .filter(a => a.title);
    renderAlertsBanner();
    if (document.getElementById('alerts-panel').style.display === 'flex') {
      document.getElementById('alerts-panel-list').innerHTML = alertsPanelHtml();
    }
  } catch (e) {
    console.error('Häiriötiedotteiden haku epäonnistui', e);
  }
}

function renderAlertsBanner() {
  const banner = document.getElementById('alerts-banner');
  if (!activeAlerts.length) { banner.style.display = 'none'; return; }
  banner.style.display = 'block';
  banner.textContent = '⚠ ' + activeAlerts.length + (activeAlerts.length === 1 ? ' häiriötiedote' : ' häiriötiedotetta') + ' — ' + activeAlerts[0].title;
}

function alertsPanelHtml() {
  if (!activeAlerts.length) return '<div class="stop-arrival-empty">Ei aktiivisia häiriötiedotteita.</div>';
  return activeAlerts.map(a => `<div class="alert-row"><div class="alert-title">${escapeHtml(a.title)}</div>${a.description ? `<div class="alert-desc">${escapeHtml(a.description)}</div>` : ''}</div>`).join('');
}

function showAlertsPanel() {
  closeVehicleRoute();
  closePlannerPanel();
  document.getElementById('alerts-panel-list').innerHTML = alertsPanelHtml();
  document.getElementById('alerts-panel').style.display = 'flex';
}

function closeAlertsPanel() {
  document.getElementById('alerts-panel').style.display = 'none';
}

document.getElementById('alerts-banner').addEventListener('click', showAlertsPanel);
document.getElementById('alerts-panel-close').addEventListener('click', closeAlertsPanel);

// --- Journey planner -----------------------------------------------------
// journey-patterns gives, per line/direction serving a stop, the full
// ordered stop sequence plus every scheduled journey (trip) on it —
// departure/arrival for the whole pattern (not per intermediate stop),
// which day types it runs on, and calendar exceptions. There's no separate
// per-stop schedule endpoint used here, so times at a stop partway through
// a pattern are estimated by interpolating between the pattern's own
// departure and arrival proportionally to the stop's position — clearly
// labelled as estimated in the results rather than presented as exact.
const JOURNEY_PATTERNS_URL = "https://data.itsfactory.fi/journeys/api/1/journey-patterns";
const WEEKDAY_NAMES = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
const TRANSFER_MIN_BUFFER_MS = 60000; // at least 1 minute to physically change buses
const TRANSFER_MAX_WAIT_MS = 45 * 60000; // don't suggest sitting around for 45+ minutes

function trailingId(url) { return (url || '').split('/').filter(Boolean).pop() || ''; }

function toYMD(date) {
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
}

function parseTimeOfDay(hms, baseDate) {
  const parts = String(hms || '').split(':').map(Number);
  const d = new Date(baseDate);
  d.setHours(0, 0, 0, 0);
  // GTFS times can exceed 24:00:00 for past-midnight trips (e.g. "25:10:00");
  // setSeconds naturally rolls that over into the next day.
  d.setSeconds((parts[0] || 0) * 3600 + (parts[1] || 0) * 60 + (parts[2] || 0));
  return d;
}

function journeyRunsOnDate(journey, date) {
  const ymd = toYMD(date);
  const exception = (journey.dayTypeExceptions || []).find(ex => ymd >= ex.from && ymd <= ex.to);
  if (exception) return exception.runs === 'yes';
  return (journey.dayTypes || []).includes(WEEKDAY_NAMES[date.getDay()]);
}

function estimateTimeAtStopIndex(journey, totalStops, stopIndex, baseDate) {
  const dep = parseTimeOfDay(journey.departureTime, baseDate);
  const arr = parseTimeOfDay(journey.arrivalTime, baseDate);
  const frac = totalStops > 1 ? stopIndex / (totalStops - 1) : 0;
  return new Date(dep.getTime() + (arr.getTime() - dep.getTime()) * frac);
}

const journeyPatternsCache = new Map(); // stopId -> Promise<pattern[]>
function fetchJourneyPatternsForStop(stopId) {
  if (journeyPatternsCache.has(stopId)) return journeyPatternsCache.get(stopId);
  const p = fetch(JOURNEY_PATTERNS_URL + '?stopPointId=' + encodeURIComponent(stopId), { cache: 'no-store' })
    .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(data => (data.body || []).map(pattern => ({
      lineId: trailingId(pattern.lineUrl),
      stopPoints: (pattern.stopPoints || []).map(s => s.shortName),
      journeys: pattern.journeys || [],
    })))
    .catch(e => { journeyPatternsCache.delete(stopId); throw e; });
  journeyPatternsCache.set(stopId, p);
  return p;
}

async function findDirectOptions(originId, destId, targetDate) {
  const patterns = await fetchJourneyPatternsForStop(originId);
  const options = [];
  patterns.forEach(pattern => {
    const oi = pattern.stopPoints.indexOf(originId);
    const di = pattern.stopPoints.indexOf(destId);
    if (oi === -1 || di === -1 || di <= oi) return;
    const total = pattern.stopPoints.length;
    pattern.journeys.forEach(j => {
      if (!journeyRunsOnDate(j, targetDate)) return;
      const dep = estimateTimeAtStopIndex(j, total, oi, targetDate);
      if (dep < targetDate) return;
      const arr = estimateTimeAtStopIndex(j, total, di, targetDate);
      options.push({ type: 'direct', dep, lineId: pattern.lineId, headSign: j.headSign, arr });
    });
  });
  options.sort((a, b) => a.dep - b.dep);
  return options;
}

async function findTransferOptions(originId, destId, targetDate) {
  const originPatterns = await fetchJourneyPatternsForStop(originId);
  // Candidate transfer stops: stops downstream of the origin on any pattern
  // serving it, excluding the destination itself (that's the direct case)
  // and anything past a stop where that same pattern already reaches it.
  const candidates = new Map(); // transferStopId -> {pattern, oi, idx}
  originPatterns.forEach(pattern => {
    const oi = pattern.stopPoints.indexOf(originId);
    if (oi === -1) return;
    const di = pattern.stopPoints.indexOf(destId);
    pattern.stopPoints.forEach((stopId, idx) => {
      if (idx <= oi || stopId === destId) return;
      if (di !== -1 && idx >= di) return;
      if (!candidates.has(stopId)) candidates.set(stopId, { pattern, oi, idx });
    });
  });
  const candidateIds = Array.from(candidates.keys()).slice(0, 10); // bound the network cost of a search

  const results = [];
  await Promise.all(candidateIds.map(async (transferId) => {
    const info = candidates.get(transferId);
    let transferPatterns;
    try { transferPatterns = await fetchJourneyPatternsForStop(transferId); } catch (e) { return; }
    transferPatterns.forEach(pattern2 => {
      if (pattern2.lineId === info.pattern.lineId) return; // not a real transfer if it's the same line
      const ti = pattern2.stopPoints.indexOf(transferId);
      const di2 = pattern2.stopPoints.indexOf(destId);
      if (ti === -1 || di2 === -1 || di2 <= ti) return;
      const total1 = info.pattern.stopPoints.length;
      const total2 = pattern2.stopPoints.length;
      info.pattern.journeys.forEach(j1 => {
        if (!journeyRunsOnDate(j1, targetDate)) return;
        const dep1 = estimateTimeAtStopIndex(j1, total1, info.oi, targetDate);
        if (dep1 < targetDate) return;
        const arr1 = estimateTimeAtStopIndex(j1, total1, info.idx, targetDate);
        pattern2.journeys.forEach(j2 => {
          if (!journeyRunsOnDate(j2, targetDate)) return;
          const dep2 = estimateTimeAtStopIndex(j2, total2, ti, targetDate);
          const wait = dep2 - arr1;
          if (wait < TRANSFER_MIN_BUFFER_MS || wait > TRANSFER_MAX_WAIT_MS) return;
          const arr2 = estimateTimeAtStopIndex(j2, total2, di2, targetDate);
          results.push({
            type: 'transfer', dep: dep1, transferStopId: transferId,
            leg1: { lineId: info.pattern.lineId, dep: dep1, arr: arr1 },
            leg2: { lineId: pattern2.lineId, dep: dep2, arr: arr2 },
          });
        });
      });
    });
  }));
  results.sort((a, b) => a.dep - b.dep);
  return results.slice(0, 20);
}

async function searchJourneys(originId, destId, targetDate) {
  const direct = await findDirectOptions(originId, destId, targetDate);
  let transfers = [];
  // Only bother with the (much more expensive) transfer search when direct
  // options are sparse — keeps the common "there's a direct bus" case fast.
  if (direct.length < 5) {
    try { transfers = await findTransferOptions(originId, destId, targetDate); }
    catch (e) { console.error('Vaihtoyhteyksien haku epäonnistui', e); }
  }
  return direct.concat(transfers).sort((a, b) => a.dep - b.dep).slice(0, 10);
}

function formatClock(date) {
  return date.toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' });
}

function renderPlannerResults(options) {
  if (!options.length) return '<div class="stop-arrival-empty">Ei löytynyt yhteyksiä valitulle ajalle.</div>';
  return options.map(opt => {
    if (opt.type === 'direct') {
      return `<div class="planner-option">
        <div class="planner-option-row"><span class="stop-arrival-route">${escapeHtml(opt.lineId)}</span><span class="planner-option-times">${formatClock(opt.dep)} → ${formatClock(opt.arr)}</span></div>
        <div class="planner-option-sub">Suora yhteys${opt.headSign ? ' · ' + escapeHtml(opt.headSign) : ''} · ajat arvioituja</div>
      </div>`;
    }
    const transferName = resolveStopName(opt.transferStopId) || ('pysäkki ' + opt.transferStopId);
    return `<div class="planner-option">
      <div class="planner-option-row"><span class="stop-arrival-route">${escapeHtml(opt.leg1.lineId)}</span><span class="planner-option-times">${formatClock(opt.leg1.dep)} → ${formatClock(opt.leg1.arr)}</span></div>
      <div class="planner-option-row"><span class="stop-arrival-route">${escapeHtml(opt.leg2.lineId)}</span><span class="planner-option-times">${formatClock(opt.leg2.dep)} → ${formatClock(opt.leg2.arr)}</span></div>
      <div class="planner-option-sub">1 vaihto pysäkillä ${escapeHtml(transferName)} · ajat arvioituja</div>
    </div>`;
  }).join('');
}

let plannerOrigin = null;
let plannerDest = null;

function renderStopSuggestions(query, container, onPick) {
  const q = query.trim().toLowerCase();
  container.innerHTML = '';
  if (!q) { container.style.display = 'none'; return; }
  const matches = allStops.filter(s => s.name.toLowerCase().includes(q)).slice(0, 8);
  if (!matches.length) { container.style.display = 'none'; return; }
  container.style.display = 'block';
  matches.forEach(s => {
    const item = document.createElement('div');
    item.className = 'planner-suggestion';
    item.textContent = s.name + ' (' + s.id + ')';
    item.onclick = () => onPick(s);
    container.appendChild(item);
  });
}

document.getElementById('planner-origin').addEventListener('input', (e) => {
  plannerOrigin = null;
  renderStopSuggestions(e.target.value, document.getElementById('planner-origin-suggestions'), (s) => {
    plannerOrigin = s;
    document.getElementById('planner-origin').value = s.name;
    document.getElementById('planner-origin-suggestions').style.display = 'none';
  });
});
document.getElementById('planner-dest').addEventListener('input', (e) => {
  plannerDest = null;
  renderStopSuggestions(e.target.value, document.getElementById('planner-dest-suggestions'), (s) => {
    plannerDest = s;
    document.getElementById('planner-dest').value = s.name;
    document.getElementById('planner-dest-suggestions').style.display = 'none';
  });
});

function localDatetimeInputValue(date) {
  const pad = (n) => String(n).padStart(2, '0');
  return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
}

document.getElementById('planner-search').addEventListener('click', async () => {
  if (!plannerOrigin || !plannerDest) { toast('Valitse lähtö- ja määränpääpysäkki listasta.'); return; }
  if (plannerOrigin.id === plannerDest.id) { toast('Lähtö ja määränpää ovat sama pysäkki.'); return; }
  const timeVal = document.getElementById('planner-time').value;
  const targetDate = timeVal ? new Date(timeVal) : new Date();
  const resultsEl = document.getElementById('planner-results');
  resultsEl.innerHTML = '<div class="stop-arrival-empty">Haetaan…</div>';
  try {
    const options = await searchJourneys(plannerOrigin.id, plannerDest.id, targetDate);
    resultsEl.innerHTML = renderPlannerResults(options);
  } catch (e) {
    console.error('Reittihaku epäonnistui', e);
    resultsEl.innerHTML = '<div class="stop-arrival-empty">Haku epäonnistui. Yritä uudelleen.</div>';
  }
});

async function pollArrivals() {
  try {
    const res = await fetch(VEHICLE_ACTIVITY_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const entries = data.body || [];
    const nextByStop = new Map();
    const nextByVehicle = new Map();
    const nextVehicleInfo = new Map();
    const now = Date.now();
    // The live feed occasionally lists the same physical vehicle more than
    // once (e.g. mid status-update), which showed up as the exact same bus
    // and time duplicated in a stop's arrivals list. Collapse near-duplicate
    // calls (same vehicle+stop within a few minutes of one already kept),
    // while still allowing a genuine loop route's distinct later pass
    // through the same stop, hours apart, to show up separately.
    const seenVehicleStop = new Map(); // "vehicleRef|stopId" -> last kept time (ms)
    const DUPLICATE_CALL_WINDOW_MS = 3 * 60000;
    entries.forEach(v => {
      const mvj = v.monitoredVehicleJourney;
      if (!mvj) return;
      const vehicleRef = mvj.vehicleRef;
      if (vehicleRef) {
        nextVehicleInfo.set(vehicleRef, {
          delaySec: parseDelaySeconds(mvj.delay),
          destinationName: resolveStopName(mvj.destinationShortName),
          originName: resolveStopName(mvj.originShortName),
        });
      }
      if (!Array.isArray(mvj.onwardCalls)) return;
      const routeId = mvj.lineRef || '?';
      const vehicleCalls = [];
      mvj.onwardCalls.forEach(call => {
        const stopId = (call.stopPointRef || '').split('/').filter(Boolean).pop();
        const t = call.expectedArrivalTime || call.aimedArrivalTime;
        if (!stopId || !t) return;
        const time = new Date(t);
        if (isNaN(time) || time.getTime() < now - 60000) return; // skip stale/past calls
        const dedupeKey = vehicleRef + '|' + stopId;
        const lastKeptTime = seenVehicleStop.get(dedupeKey);
        if (lastKeptTime != null && Math.abs(time.getTime() - lastKeptTime) < DUPLICATE_CALL_WINDOW_MS) return;
        seenVehicleStop.set(dedupeKey, time.getTime());
        if (!nextByStop.has(stopId)) nextByStop.set(stopId, []);
        nextByStop.get(stopId).push({ routeId, time, vehicleId: vehicleRef });
        vehicleCalls.push({ stopId, time });
      });
      if (vehicleRef && vehicleCalls.length) {
        vehicleCalls.sort((a, b) => a.time - b.time);
        nextByVehicle.set(vehicleRef, vehicleCalls);
      }
    });
    nextByStop.forEach(list => list.sort((a, b) => a.time - b.time));
    arrivalsByStop = nextByStop;
    onwardCallsByVehicle = nextByVehicle;
    vehicleInfoByVehicle = nextVehicleInfo;
    // Keep an already-open popup/panel's countdown fresh instead of making
    // the rider close and reopen it to see updated arrival times.
    refreshOpenStopPopups();
    refreshOpenVehiclePanel();
  } catch (e) {
    console.error('Saapumisennusteiden haku epäonnistui', e);
  }
}

function passesFilter(routeId) {
  // Text search temporarily overrides the saved route picks (rather than
  // clearing them) so typing in the box never erases what's persisted.
  if (filterText) return routeId.toLowerCase().includes(filterText.toLowerCase());
  if (selectedRoutes.size > 0) return selectedRoutes.has(routeId);
  return true;
}

function setStatus(ok, msg) {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  const err = document.getElementById('err');
  if (ok) {
    dot.classList.remove('stale');
    dot.classList.add('pulse');
    txt.textContent = msg || "live";
    err.style.display = 'none';
  } else {
    dot.classList.remove('pulse');
    dot.classList.add('stale');
    txt.textContent = "yhteysongelma";
    err.textContent = msg || "Rajapintaan ei saada yhteyttä.";
    err.style.display = 'block';
  }
}

function toast(msg) {
  const err = document.getElementById('err');
  err.textContent = msg;
  err.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { if (lastFetchOk !== false) err.style.display = 'none'; }, 3000);
}

function syncFilterUI() {
  document.getElementById('filter-clear').style.display = (filterText || selectedRoutes.size > 0) ? 'flex' : 'none';
}

function rebuildChips(allRoutes) {
  const container = document.getElementById('route-chips');
  const sorted = Array.from(allRoutes).sort((a,b) => {
    const na = parseInt(a), nb = parseInt(b);
    if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
    return a.localeCompare(b, 'fi');
  });
  container.innerHTML = '';
  sorted.forEach(r => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (selectedRoutes.has(r) ? ' on' : '');
    chip.textContent = r;
    chip.onclick = () => {
      filterText = '';
      document.getElementById('filter-input').value = '';
      if (selectedRoutes.has(r)) selectedRoutes.delete(r);
      else selectedRoutes.add(r);
      saveSelectedRoutes();
      applyFilterToMarkers();
      applyPickedHighlight();
      rebuildChips(allRoutes);
      syncFilterUI();
    };
    container.appendChild(chip);
  });
}

function applyFilterToMarkers() {
  markers.forEach(({marker, routeId}) => {
    const show = passesFilter(routeId);
    const el = marker.getElement();
    if (el) el.style.display = show ? '' : 'none';
  });
}

function applyPickedHighlight() {
  markers.forEach(entry => {
    entry.iconEl.classList.toggle('picked', selectedRoutes.has(entry.routeId));
  });
}

function createMarker(id, routeId, lat, lon, bearing, trip, occupancy) {
  const picked = selectedRoutes.has(routeId);
  const icon = L.divIcon({ html: buildIconHtml(routeId, picked), className: '', iconSize: [22,22], iconAnchor: [11,11], popupAnchor: [0,-14] });
  const marker = L.marker([lat, lon], { icon }).addTo(map);
  const entry = { marker, routeId, lastSeen: Date.now(), rotation: bearing, trip, occupancy, animating: false };
  marker.bindPopup(() => popupHtml(entry, id));

  const el = marker.getElement();
  entry.iconEl = el.querySelector('.bus-icon');
  entry.labelEl = el.querySelector('.label');
  entry.iconEl.style.transform = `rotate(${bearing}deg)`;
  entry.labelEl.style.transform = `rotate(${-bearing}deg)`;
  el.style.display = passesFilter(routeId) ? '' : 'none';

  // Fade the marker in instead of popping in at full opacity.
  el.style.opacity = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => { el.style.opacity = '1'; }));

  markers.set(id, entry);
}

// Position and rotation are never set directly from a poll response — instead
// each update just records where the marker should END UP, and the shared
// tickMarkerAnimations loop below moves it there frame by frame. Real lat/lon
// (not CSS transform) drives the motion, so Leaflet always re-projects it
// correctly no matter what the map is doing (panning, zooming, recentering).
function updateMarker(entry, id, routeId, lat, lon, bearing, trip, occupancy) {
  const cur = entry.marker.getLatLng();
  entry.animFromLat = cur.lat;
  entry.animFromLon = cur.lng;
  entry.animToLat = lat;
  entry.animToLon = lon;
  entry.animFromRotation = entry.rotation;
  entry.animToRotation = shortestRotation(entry.rotation, bearing);
  entry.animStart = performance.now();
  entry.animDuration = POLL_MS;
  entry.animating = true;

  entry.trip = trip;
  entry.occupancy = occupancy;
  entry.lastSeen = Date.now();
  if (entry.routeId !== routeId) {
    entry.routeId = routeId;
    entry.labelEl.textContent = routeId;
  }
  entry.iconEl.classList.toggle('picked', selectedRoutes.has(routeId));
  const el = entry.marker.getElement();
  if (el) el.style.display = passesFilter(routeId) ? '' : 'none';
}

function lerp(a, b, t) { return a + (b - a) * t; }

// Leaflet jumps map._pixelOrigin to the TARGET zoom's value right when a zoom
// animation starts (not when it ends) and fakes the visual in-between purely
// with a CSS transform on the map pane. A marker.setLatLng() call in that
// window computes its pixel position from the new-zoom math while the pane
// around it is still mid-illusion for the old-to-new transition, so the icon
// visibly detaches ("floats") until the animation settles. The fix is simply
// to not touch marker positions while Leaflet's own zoom/pan machinery is
// running — resuming afterward picks the interpolation back up seamlessly,
// since it's driven by elapsed real time, not frame count.
let viewChanging = false;
map.on('zoomstart movestart', () => { viewChanging = true; });
map.on('zoomend moveend', () => { viewChanging = false; });

function tickMarkerAnimations() {
  if (!viewChanging) {
    const now = performance.now();
    markers.forEach(entry => {
      if (!entry.animating) return;
      const t = Math.min(1, (now - entry.animStart) / entry.animDuration);
      entry.rotation = lerp(entry.animFromRotation, entry.animToRotation, t);
      entry.marker.setLatLng([lerp(entry.animFromLat, entry.animToLat, t), lerp(entry.animFromLon, entry.animToLon, t)]);
      entry.iconEl.style.transform = `rotate(${entry.rotation}deg)`;
      entry.labelEl.style.transform = `rotate(${-entry.rotation}deg)`;
      if (t >= 1) entry.animating = false;
    });
  }
  requestAnimationFrame(tickMarkerAnimations);
}
requestAnimationFrame(tickMarkerAnimations);

function removeMarker(entry) {
  entry.animating = false;
  const el = entry.marker.getElement();
  if (el) el.style.opacity = '0';
  setTimeout(() => map.removeLayer(entry.marker), 400);
}

async function poll() {
  try {
    const res = await fetch(FEED_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const entities = data.entity || [];
    const seenIds = new Set();
    const allRoutes = new Set();

    entities.forEach(ent => {
      const v = ent.vehicle;
      if (!v || !v.position || !v.vehicle) return;
      const id = v.vehicle.id;
      const routeId = (v.trip && v.trip.route_id) ? v.trip.route_id : '?';
      const lat = v.position.latitude;
      const lon = v.position.longitude;
      const bearing = v.position.bearing || 0;
      // Only present for vehicles with passenger counting hardware — most
      // won't have it, so this is read defensively and just omitted from
      // the popup (via OCCUPANCY_LABELS) when absent or unrecognized.
      const occupancy = v.occupancy_status;
      if (lat == null || lon == null) return;

      seenIds.add(id);
      allRoutes.add(routeId);

      const existing = markers.get(id);
      if (existing) {
        updateMarker(existing, id, routeId, lat, lon, bearing, v.trip, occupancy);
      } else {
        createMarker(id, routeId, lat, lon, bearing, v.trip, occupancy);
      }
    });

    // remove vehicles no longer present
    markers.forEach((entry, id) => {
      if (!seenIds.has(id)) {
        removeMarker(entry);
        markers.delete(id);
      }
    });

    document.getElementById('stat-count').textContent = seenIds.size;
    document.getElementById('stat-routes').textContent = allRoutes.size;
    document.getElementById('stat-time').textContent = new Date().toLocaleTimeString('fi-FI');

    // Only touch the chip row's DOM when the set of routes actually changed —
    // rebuilding it every 5s otherwise causes needless flicker/scroll resets.
    lastAllRoutes = allRoutes;
    const sig = Array.from(allRoutes).sort().join(',');
    if (sig !== lastRouteSignature) {
      lastRouteSignature = sig;
      rebuildChips(allRoutes);
    }
    setStatus(true, 'live · päivitys ' + (POLL_MS/1000) + ' s');
    lastFetchOk = true;
  } catch (e) {
    setStatus(false, 'Rajapintaan ei saada yhteyttä (' + e.message + ')');
    lastFetchOk = false;
  }
}

document.getElementById('filter-input').addEventListener('input', (e) => {
  // Typing only shadows the saved route picks for display purposes — it
  // does not touch (or persist over) selectedRoutes, so clearing the text
  // box always brings the saved picks straight back.
  filterText = e.target.value.trim();
  applyFilterToMarkers();
  syncFilterUI();
});

document.getElementById('filter-clear').addEventListener('click', () => {
  filterText = '';
  selectedRoutes.clear();
  saveSelectedRoutes();
  document.getElementById('filter-input').value = '';
  applyFilterToMarkers();
  applyPickedHighlight();
  rebuildChips(lastAllRoutes);
  syncFilterUI();
});

let userMarker = null, userAccuracyCircle = null, watchId = null;
function updateUserLocation(lat, lon, accuracy) {
  if (!userMarker) {
    userMarker = L.marker([lat, lon], { icon: L.divIcon({ html: '<div class="user-dot"></div>', className: '', iconSize: [14,14], iconAnchor: [7,7] }), zIndexOffset: 1000 }).addTo(map);
    userAccuracyCircle = L.circle([lat, lon], { radius: accuracy, color: '#3b82f6', weight: 1, fillColor: '#3b82f6', fillOpacity: 0.12 }).addTo(map);
  } else {
    userMarker.setLatLng([lat, lon]);
    userAccuracyCircle.setLatLng([lat, lon]).setRadius(accuracy);
  }
}

document.getElementById('btn-locate').addEventListener('click', (e) => {
  if (!navigator.geolocation) { toast('Selain ei tue paikannusta.'); return; }
  const btn = e.currentTarget;
  navigator.geolocation.getCurrentPosition((pos) => {
    const { latitude, longitude, accuracy } = pos.coords;
    updateUserLocation(latitude, longitude, accuracy);
    map.setView([latitude, longitude], 15);
    btn.classList.add('active');
    if (!watchId) {
      watchId = navigator.geolocation.watchPosition((p) => {
        updateUserLocation(p.coords.latitude, p.coords.longitude, p.coords.accuracy);
      }, () => {}, { enableHighAccuracy: true, maximumAge: 10000 });
    }
  }, (err) => {
    toast('Sijaintia ei saatu (' + err.message + ')');
  }, { enableHighAccuracy: true, timeout: 8000 });
});

document.getElementById('btn-fit').addEventListener('click', () => {
  const latlngs = Array.from(markers.values())
    .filter(m => passesFilter(m.routeId))
    .map(m => m.marker.getLatLng());
  if (latlngs.length === 0) { toast('Ei näkyviä bussisijainteja.'); return; }
  map.fitBounds(L.latLngBounds(latlngs), { padding: [50, 50], maxZoom: 16 });
});

// Each feature's startup is isolated in its own try/catch: this is a plain
// non-module script, so one synchronous throw here would otherwise abort
// every statement after it — silently taking out arrivals, alerts, and
// everything else along with whatever actually failed.
function safeStart(fn, label) {
  try { fn(); } catch (e) { console.error(label + ' ei käynnistynyt', e); }
}

safeStart(() => { syncFilterUI(); poll(); setInterval(poll, POLL_MS); }, 'Bussiseuranta');
safeStart(() => { loadStops(); }, 'Pysäkkien lataus');
safeStart(() => { pollArrivals(); setInterval(pollArrivals, ARRIVALS_POLL_MS); }, 'Saapumisennusteet');
safeStart(() => { pollServiceAlerts(); setInterval(pollServiceAlerts, ALERTS_POLL_MS); }, 'Häiriötiedotteet');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  // skipWaiting()/clients.claim() in sw.js hand control to a new service
  // worker promptly, but they don't refresh an already-open tab's already-
  // running JavaScript — without this, an installed PWA that's never fully
  // closed and reopened can keep running old code indefinitely even though
  // "the app has updated". Reload once, the first time control changes.
  let swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swRefreshed) return;
    swRefreshed = true;
    window.location.reload();
  });
}
</script>

</body>
</html>
